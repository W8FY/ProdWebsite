name: Build and Deploy Hugo to FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main   # Or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: 'latest'

    - name: Verify member roster data
      run: test -f static/data/member-roster.json

    - name: Build Hugo site
      run: hugo --baseURL https://w8fy.org/

    - name: Add Net Check-In frontend to published site
      run: |
        mkdir -p public/net-checkin/css public/net-checkin/js public/static/docs
        cp net-checkin/index.html public/net-checkin/index.html
        cp net-checkin/css/style.css public/net-checkin/css/style.css
        cp net-checkin/js/config.js public/net-checkin/js/config.js
        cp net-checkin/js/google-apps-script.js public/net-checkin/js/google-apps-script.js
        cp net-checkin/js/app.js public/net-checkin/js/app.js
        cp static/docs/2026_net_roster.pdf public/static/docs/2026_net_roster.pdf

    - name: Deploy to FTP server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /public_html/
        local-dir: ./public/
        delete: true 
